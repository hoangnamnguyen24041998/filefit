<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="ff-bg-grad" x1="64" y1="4" x2="64" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="ff-border-grad" x1="64" y1="4" x2="64" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255,255,255,0.24)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.04)"/>
    </linearGradient>
    <filter id="ff-dot-glow" x="80" y="20" width="28" height="28" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#ff-bg-grad)"/>
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="31.25" stroke="url(#ff-border-grad)" stroke-width="1.5" />
  
  <!-- Subtle Top Specular Shine -->
  <path d="M 38 7 Q 64 9.5 90 7" stroke="rgba(255,255,255,0.28)" stroke-width="1.25" stroke-linecap="round" />

  <!-- Inward-Pinching Frame Brackets (Top Left, Bottom Left, Bottom Right, Top Right) -->
  <g stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top-Left Bracket -->
    <path d="M 34 50 V 38 C 34 35.79 35.79 34 38 34 H 50" />
    <!-- Bottom-Left Bracket -->
    <path d="M 34 78 V 90 C 34 92.21 35.79 94 38 94 H 50" />
    <!-- Bottom-Right Bracket -->
    <path d="M 78 94 H 90 C 92.21 94 94 92.21 94 90 V 78" />
    <!-- Top-Right Bracket (with gap for Emerald Dot) -->
    <path d="M 76 34 H 80" />
    <path d="M 94 48 V 52" />
  </g>

  <!-- Precision File / Upload Fitting Glyph -->
  <!-- Document base / tray -->
  <path d="M 48 80 H 80" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" />
  <!-- Upload arrow shaft -->
  <path d="M 64 80 V 48" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" />
  <!-- Upload arrow head -->
  <path d="M 52 60 L 64 48 L 76 60" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Inward pinch indicators (subtle precision markers) -->
  <path d="M 38 64 H 42" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M 86 64 H 90" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- Precision Emerald Status Dot with Cutout Ring -->
  <g>
    <!-- Cutout mask ring matching squircle bg -->
    <circle cx="94" cy="34" r="10.5" fill="#0F172A" />
    <!-- Emerald Status Dot -->
    <circle cx="94" cy="34" r="7.5" fill="#10B981" />
    <!-- Inner specular glint -->
    <circle cx="92" cy="32" r="2.2" fill="#FFFFFF" fill-opacity="0.5" />
  </g>
</svg>
