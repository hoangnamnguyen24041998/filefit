<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <!-- 16px Optically Simplified Squircle -->
  <rect x="0.5" y="0.5" width="15" height="15" rx="3.5" fill="#0F172A" stroke="rgba(255,255,255,0.22)" stroke-width="0.8"/>
  
  <!-- Corner Brackets -->
  <path d="M 3.5 5.8 V 4.2 C 3.5 3.8 3.8 3.5 4.2 3.5 H 5.8" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 3.5 10.2 V 11.8 C 3.5 12.2 3.8 12.5 4.2 12.5 H 5.8" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 10.2 12.5 H 11.8 C 12.2 12.5 12.5 12.2 12.5 11.8 V 10.2" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Centered Precision Arrow & Base -->
  <path d="M 5.5 11.5 H 10.5" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M 8 11.5 V 6" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M 5.8 7.8 L 8 5.6 L 10.2 7.8" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Precision Emerald Status Indicator (Razor sharp at 16px) -->
  <circle cx="12.2" cy="3.8" r="2.2" fill="#0F172A"/>
  <circle cx="12.2" cy="3.8" r="1.5" fill="#10B981"/>
</svg>
